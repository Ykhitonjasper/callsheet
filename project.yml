name: CallSheet
options:
  bundleIdPrefix: com.callsheet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: CallSheet/Info.plist
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_BUNDLE_IDENTIFIER: com.callsheet.CallSheet
    PRODUCT_NAME: CallSheet
    DEVELOPMENT_TEAM: "QPN38WN543"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO
targets:
  CallSheet:
    type: application
    platform: iOS
    sources:
      - path: CallSheet
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
    resources:
      - path: CallSheet/Assets.xcassets
      - path: CallSheet/PrivacyInfo.xcprivacy
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleName: "Callerinsightpros 2026"
        INFOPLIST_KEY_CFBundleDisplayName: "Callerinsightpros 2026"
        PRODUCT_BUNDLE_IDENTIFIER: com.callsheet.CallSheet
        PRODUCT_DISPLAY_NAME: "Callerinsightpros 2026"
        CODE_SIGN_ENTITLEMENTS: Config/CallSheet.entitlements
        DEVELOPMENT_TEAM: "QPN38WN543"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  CallSheetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CallSheetUITests
    dependencies:
      - target: CallSheet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.callsheet.CallSheet.uitests
        PRODUCT_NAME: CallSheetUITests
        PRODUCT_MODULE_NAME: CallSheetUITests
        DEVELOPMENT_TEAM: "QPN38WN543"
        TEST_TARGET_NAME: CallSheet
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  CallSheet:
    build:
      targets:
        CallSheet: all
        CallSheetUITests: [test]
    test:
      targets:
        - CallSheetUITests
